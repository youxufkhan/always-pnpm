<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <title>always-pnpm - Zero Package Redundancy. 100% Deterministic pnpm Enforcement.</title>
  <defs>
    <!-- Slate Background Gradients -->
    <linearGradient id="slateCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="ambientOrange" cx="18%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientSky" cx="82%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Linear Gradients for Typography -->
    <linearGradient id="textWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="slateGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Slate Canvas -->
  <rect width="1200" height="480" rx="14" fill="url(#slateCanvas)"/>
  <rect width="1200" height="480" rx="14" fill="url(#slateGrid)"/>
  <rect width="1200" height="480" rx="14" fill="url(#ambientOrange)"/>
  <rect width="1200" height="480" rx="14" fill="url(#ambientSky)"/>

  <!-- Clean Precision Outer Border -->
  <rect x="1" y="1" width="1198" height="478" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Left Section: Header, Typography & Terminal Card (X: 55 to 620) -->
  <g transform="translate(55, 45)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="215" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#f97316" filter="url(#subtleGlow)"/>
      <text x="25" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">MULTI-AGENT PNPM ENFORCER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#textWhite)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.03em">
      always-pnpm
    </text>

    <!-- Tagline -->
    <text x="0" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16" font-weight="400">
      Zero Package Redundancy. 100% Deterministic pnpm Enforcement.
    </text>

    <!-- Minimalist Terminal Rewrite Card -->
    <g transform="translate(0, 142)">
      <rect width="530" height="195" rx="10" fill="url(#cardSlate)" stroke="#334155" stroke-width="1"/>

      <!-- Window Header Bar -->
      <circle cx="20" cy="18" r="4" fill="#475569"/>
      <circle cx="34" cy="18" r="4" fill="#475569"/>
      <circle cx="48" cy="18" r="4" fill="#475569"/>
      <text x="70" y="22" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        PreToolUse &amp; Lifecycle :: Multi-Agent Interception
      </text>
      <line x1="0" y1="36" x2="530" y2="36" stroke="#1e293b" stroke-width="1"/>

      <!-- Command Intercepted Line -->
      <g transform="translate(20, 56)">
        <text x="0" y="15" fill="#64748b" font-family="ui-monospace, monospace" font-size="11.5">Agent Intent:</text>
        <rect x="95" y="0" width="265" height="24" rx="4" fill="#181825" stroke="#ef4444" stroke-opacity="0.3"/>
        <text x="105" y="16" fill="#f87171" font-family="ui-monospace, monospace" font-size="11.5" text-decoration="line-through">$ npm install express lodash</text>
        <rect x="370" y="0" width="140" height="24" rx="4" fill="#2d1215" stroke="#7f1d1d" stroke-width="0.8"/>
        <text x="380" y="16" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="10" font-weight="700">⚡ REWRITTEN (&lt;3ms)</text>
      </g>

      <!-- Command Executed Line -->
      <g transform="translate(20, 94)">
        <text x="0" y="15" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Executed:</text>
        <rect x="95" y="0" width="265" height="24" rx="4" fill="#0c2338" stroke="#0284c7" stroke-opacity="0.5"/>
        <text x="105" y="16" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">$ pnpm add express lodash</text>
        <rect x="370" y="0" width="140" height="24" rx="4" fill="#042f2e" stroke="#065f46" stroke-width="0.8"/>
        <text x="390" y="16" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10" font-weight="700">✓ HARD-LINKED</text>
      </g>

      <!-- Footnote Pill -->
      <g transform="translate(20, 138)">
        <rect width="490" height="38" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
          <tspan fill="#f97316" font-weight="700">Content-Addressable Store:</tspan> Packages stored once on disk, linked across workspaces.
        </text>
      </g>
    </g>

    <!-- Bottom Feature Tags Row -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="135" height="26" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="14" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">⚡ Python 3 Core</text>

      <rect x="145" y="0" width="145" height="26" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="156" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">🤖 4 Coding Agents</text>

      <rect x="300" y="0" width="140" height="26" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="312" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">🛡️ Pipeline Safe</text>

      <rect x="450" y="0" width="80" height="26" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="464" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">⚖️ MIT</text>
    </g>
  </g>

  <!-- Right Section: Pure SVG Architectural Hard-Link Topology Graphic (X: 650 to 1145) -->
  <g transform="translate(640, 55)">
    <!-- Container Card -->
    <rect width="505" height="375" rx="12" fill="#0c1322" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Schematic Header -->
    <g transform="translate(24, 20)">
      <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Hard-Link Architecture</text>
      <text x="0" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Deduplicating multiple workspaces to a single store</text>
    </g>

    <!-- Central Node: Global Store -->
    <g transform="translate(170, 75)">
      <rect width="165" height="75" rx="10" fill="#1e1814" stroke="#f97316" stroke-width="1.5"/>
      <circle cx="20" cy="22" r="5" fill="#f97316" filter="url(#subtleGlow)"/>
      <text x="32" y="26" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Central Store</text>
      <text x="14" y="46" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">~/.local/share/pnpm</text>
      <text x="14" y="62" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">✓ Deduplicated Storage</text>
    </g>

    <!-- Connecting Hard-Link Beams -->
    <!-- Link to Workspace A -->
    <path d="M 210 150 L 100 210" fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="4 3"/>
    <!-- Link to Workspace B -->
    <path d="M 252 150 L 252 210" fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="4 3"/>
    <!-- Link to Workspace C -->
    <path d="M 295 150 L 405 210" fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="4 3"/>

    <!-- Workspace A Card -->
    <g transform="translate(25, 215)">
      <rect width="135" height="85" rx="8" fill="#111c2e" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="22" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">📁 Project Alpha</text>
      <text x="12" y="42" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">node_modules/</text>
      <line x1="12" y1="52" x2="123" y2="52" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="70" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="600">0 MB redundant</text>
    </g>

    <!-- Workspace B Card -->
    <g transform="translate(185, 215)">
      <rect width="135" height="85" rx="8" fill="#111c2e" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="22" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">📁 Project Beta</text>
      <text x="12" y="42" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">node_modules/</text>
      <line x1="12" y1="52" x2="123" y2="52" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="70" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="600">0 MB redundant</text>
    </g>

    <!-- Workspace C Card -->
    <g transform="translate(345, 215)">
      <rect width="135" height="85" rx="8" fill="#111c2e" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="22" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">📁 Project Gamma</text>
      <text x="12" y="42" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">node_modules/</text>
      <line x1="12" y1="52" x2="123" y2="52" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="70" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="600">0 MB redundant</text>
    </g>

    <!-- Bottom Stat Pill -->
    <g transform="translate(25, 318)">
      <rect width="455" height="36" rx="6" fill="#091322" stroke="#1e293b" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#10b981"/>
      <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
        Average space savings: <tspan fill="#4ade80" font-weight="700">~91% across multiple repositories</tspan>
      </text>
    </g>
  </g>
</svg>
