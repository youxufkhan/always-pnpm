<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <title>always-pnpm Hero Layout</title>
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowOrange" cx="15%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowCyan" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Background Canvas -->
  <rect width="1200" height="500" rx="16" fill="#07090e"/>
  <rect width="1200" height="500" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="500" rx="16" fill="url(#bgGlowOrange)"/>
  <rect width="1200" height="500" rx="16" fill="url(#bgGlowCyan)"/>

  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="498" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Column: Typography & Content -->
  <g transform="translate(60, 60)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="28" rx="14" fill="#0f172a" stroke="url(#badgeGrad)" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="4.5" fill="#f97316" filter="url(#glow)"/>
      <text x="28" y="18" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.08em">ANTIGRAVITY CLI PLUGIN</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.03em">
      always-pnpm
    </text>

    <!-- Tagline -->
    <text x="0" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Zero Package Redundancy. Instant Command Rewriting.
    </text>

    <!-- Interactive Terminal Interception Showcase Card -->
    <g transform="translate(0, 155)">
      <!-- Card Container -->
      <rect width="520" height="185" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>

      <!-- Terminal Header Dots -->
      <circle cx="20" cy="18" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
      <circle cx="34" cy="18" r="4.5" fill="#eab308" fill-opacity="0.8"/>
      <circle cx="48" cy="18" r="4.5" fill="#22c55e" fill-opacity="0.8"/>
      <text x="70" y="22" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">
        PreToolUse :: run_command hook
      </text>
      <line x1="0" y1="36" x2="520" y2="36" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

      <!-- Intercepted Command (npm) -->
      <g transform="translate(20, 56)">
        <text x="0" y="14" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">Agent input:</text>
        <rect x="85" y="0" width="280" height="22" rx="4" fill="#1e1e2e" stroke="#ef4444" stroke-opacity="0.4"/>
        <text x="95" y="15" fill="#f87171" font-family="ui-monospace, monospace" font-size="12" text-decoration="line-through">$ npm install express lodash</text>
        <!-- Tag -->
        <rect x="375" y="0" width="125" height="22" rx="4" fill="#450a0a" stroke="#b91c1c" stroke-width="0.8"/>
        <text x="385" y="15" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">⚡ REWRITTEN (3ms)</text>
      </g>

      <!-- Executed Command (pnpm) -->
      <g transform="translate(20, 92)">
        <text x="0" y="14" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">Executed:</text>
        <rect x="85" y="0" width="280" height="22" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-opacity="0.6"/>
        <text x="95" y="15" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">$ pnpm add express lodash</text>
        <!-- Tag -->
        <rect x="375" y="0" width="125" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
        <text x="396" y="15" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">✓ SUCCESS</text>
      </g>

      <!-- Savings Pill Banner -->
      <g transform="translate(20, 134)">
        <rect width="480" height="34" rx="6" fill="#0b1329" stroke="#1d4ed8" stroke-opacity="0.3" stroke-width="1"/>
        <text x="14" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
          <tspan fill="#38bdf8" font-weight="700">Single Central Store</tspan> · Hard-linked deduplication · Zero redundant disk usage
        </text>
      </g>
    </g>

    <!-- Key Feature Badges Row -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="17" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">⚡ Python 3 Hook</text>

      <rect x="140" y="0" width="135" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="155" y="17" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🛡️ Pipeline Safe</text>

      <rect x="285" y="0" width="145" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="300" y="17" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">📦 Workspace Ready</text>

      <rect x="440" y="0" width="80" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="455" y="17" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">⚖️ MIT</text>
    </g>
  </g>

  <!-- Right Column: 3D Subject Area (X: 620 to 1160, Y: 20 to 480) -->
  <g id="hero-subject-container" transform="translate(640, 20)">
    <!-- Decorative background glow behind the cube -->
    <circle cx="260" cy="230" r="180" fill="#f97316" fill-opacity="0.12" filter="url(#glow)"/>
    <circle cx="260" cy="230" r="130" fill="#06b6d4" fill-opacity="0.15" filter="url(#glow)"/>
  </g>
</svg>
