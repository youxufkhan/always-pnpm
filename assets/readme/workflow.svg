<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" height="100%">
  <title>always-pnpm Hook Execution Lifecycle - Midnight Slate</title>
  <defs>
    <linearGradient id="wfSlateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeSlateNpm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161114"/>
      <stop offset="100%" stop-color="#110d10"/>
    </linearGradient>
    <linearGradient id="nodeSlateHook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nodeSlatePnpm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082236"/>
      <stop offset="100%" stop-color="#0c2f4a"/>
    </linearGradient>
    <linearGradient id="nodeSlateStore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24140b"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </linearGradient>

    <pattern id="wfSlateGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="330" rx="14" fill="url(#wfSlateBg)"/>
  <rect width="1200" height="330" rx="14" fill="url(#wfSlateGrid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(50, 36)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.02em">
      Deterministic Hook Lifecycle Flow
    </text>
    <text x="0" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      How always-pnpm intercepts tool calls and eliminates package duplication at runtime
    </text>
  </g>

  <!-- 4-Stage Horizontal Pipeline -->
  <g transform="translate(50, 92)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="175" rx="8" fill="url(#nodeSlateNpm)" stroke="#4c1d24" stroke-width="1"/>
      <rect x="14" y="14" width="65" height="18" rx="3" fill="#2d1217"/>
      <text x="21" y="27" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">STAGE 1</text>
      <text x="14" y="52" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Agent Proposal</text>
      <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Agent attempts to run an npm command:</text>

      <rect x="14" y="88" width="202" height="38" rx="4" fill="#0f0c0e" stroke="#2e161c"/>
      <text x="22" y="104" fill="#64748b" font-family="ui-monospace, monospace" font-size="9.5">Agent (Antigravity/Claude/etc):</text>
      <text x="22" y="118" fill="#f87171" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">$ npm i lodash</text>

      <text x="14" y="152" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10">⚠️ Redundant package bloat</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(242, 88)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#f97316" stroke-width="1.8" stroke-dasharray="3 2"/>
      <polygon points="43,0 33,-4 33,4" fill="#f97316"/>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(295, 0)">
      <rect width="250" height="175" rx="8" fill="url(#nodeSlateHook)" stroke="#f97316" stroke-opacity="0.8" stroke-width="1.2"/>
      <rect x="14" y="14" width="85" height="18" rx="3" fill="#331407"/>
      <text x="21" y="27" fill="#fdba74" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">PRETOOLUSE</text>
      <text x="14" y="52" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">always-pnpm Hook</text>
      <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Zero-dep Python parser tokenizes line:</text>

      <rect x="14" y="88" width="222" height="38" rx="4" fill="#0c1322" stroke="#1e293b"/>
      <text x="22" y="104" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5">Token translation matrix</text>
      <text x="22" y="118" fill="#fb923c" font-family="ui-monospace, monospace" font-size="10" font-weight="700">npm i ➔ pnpm add (&lt;3ms)</text>

      <text x="14" y="152" fill="#fdba74" font-family="-apple-system, sans-serif" font-size="10">⚡ Overwrite or Guided Block</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(557, 88)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="3 2"/>
      <polygon points="43,0 33,-4 33,4" fill="#0ea5e9"/>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(610, 0)">
      <rect width="230" height="175" rx="8" fill="url(#nodeSlatePnpm)" stroke="#0284c7" stroke-width="1"/>
      <rect x="14" y="14" width="65" height="18" rx="3" fill="#0c2e44"/>
      <text x="21" y="27" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">STAGE 3</text>
      <text x="14" y="52" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Clean Execution</text>
      <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Agent executes pnpm command:</text>

      <rect x="14" y="88" width="202" height="38" rx="4" fill="#041624" stroke="#034870"/>
      <text x="22" y="104" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5">Executed in shell:</text>
      <text x="22" y="118" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">$ pnpm add lodash</text>

      <text x="14" y="152" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10">✓ Deterministic pnpm run</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <g transform="translate(852, 88)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3 2"/>
      <polygon points="43,0 33,-4 33,4" fill="#10b981"/>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(905, 0)">
      <rect width="195" height="175" rx="8" fill="url(#nodeSlateStore)" stroke="#ea580c" stroke-opacity="0.8" stroke-width="1"/>
      <rect x="14" y="14" width="70" height="18" rx="3" fill="#38190b"/>
      <text x="21" y="27" fill="#fdba74" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">OUTCOME</text>
      <text x="14" y="52" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Hard-link Store</text>
      <text x="14" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Saved once globally:</text>

      <rect x="14" y="88" width="167" height="38" rx="4" fill="#130904" stroke="#52220d"/>
      <text x="20" y="104" fill="#fb923c" font-family="ui-monospace, monospace" font-size="9">~/.local/share/pnpm</text>
      <text x="20" y="118" fill="#4ade80" font-family="ui-monospace, monospace" font-size="10" font-weight="700">91% Disk Saved</text>

      <text x="14" y="152" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10">🚀 Hard-link mapped</text>
    </g>
  </g>
</svg>
