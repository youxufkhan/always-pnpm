<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <title>always-pnpm Hook Execution Lifecycle</title>
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeNpm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="nodeHook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nodePnpm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="nodeStore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#2a0d05"/>
    </linearGradient>

    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="wfGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="14" fill="url(#wfBg)"/>
  <rect width="1200" height="360" rx="14" fill="url(#wfGrid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Diagram Title -->
  <g transform="translate(50, 45)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em">
      Deterministic Hook Lifecycle Flow
    </text>
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      How always-pnpm intercepts tool calls and eliminates package duplication at runtime
    </text>
  </g>

  <!-- Workflow Stages (Horizontal) -->
  <g transform="translate(50, 105)">
    <!-- Stage 1: Agent Emits Command -->
    <g transform="translate(0, 0)">
      <rect width="230" height="185" rx="10" fill="url(#nodeNpm)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="14" y="14" width="70" height="20" rx="4" fill="#450a0a"/>
      <text x="22" y="28" fill="#f87171" font-family="ui-monospace, monospace" font-size="10" font-weight="700">STAGE 1</text>
      <text x="14" y="58" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Agent Proposal</text>
      <text x="14" y="78" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">Agent attempts to run an npm command:</text>

      <rect x="14" y="96" width="202" height="42" rx="6" fill="#11111b" stroke="#313244"/>
      <text x="24" y="116" fill="#6c7086" font-family="ui-monospace, monospace" font-size="10">run_command args:</text>
      <text x="24" y="130" fill="#f87171" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">$ npm i lodash</text>

      <text x="14" y="165" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="10.5">⚠️ Would duplicate packages</text>
    </g>

    <!-- Connector Arrow 1 -> 2 -->
    <g transform="translate(240, 92)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#f97316" stroke-width="2.5" stroke-dasharray="4 2"/>
      <polygon points="45,0 33,-5 33,5" fill="#f97316"/>
    </g>

    <!-- Stage 2: Hook Interception -->
    <g transform="translate(295, 0)">
      <rect width="250" height="185" rx="10" fill="url(#nodeHook)" stroke="#f97316" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="14" y="14" width="90" height="20" rx="4" fill="#431407"/>
      <text x="22" y="28" fill="#fb923c" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PRETOOLUSE</text>
      <text x="14" y="58" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">always-pnpm Hook</text>
      <text x="14" y="78" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">Zero-dep Python parser tokenizes shell line:</text>

      <rect x="14" y="96" width="222" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="24" y="114" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5">Token translation matrix</text>
      <text x="24" y="130" fill="#fb923c" font-family="ui-monospace, monospace" font-size="10" font-weight="700">npm i ➔ pnpm add (&lt;3ms)</text>

      <text x="14" y="165" fill="#fdba74" font-family="-apple-system, sans-serif" font-size="10.5">⚡ Emits overwrite payload</text>
    </g>

    <!-- Connector Arrow 2 -> 3 -->
    <g transform="translate(555, 92)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2"/>
      <polygon points="45,0 33,-5 33,5" fill="#38bdf8"/>
    </g>

    <!-- Stage 3: Execution & Overwrite -->
    <g transform="translate(610, 0)">
      <rect width="230" height="185" rx="10" fill="url(#nodePnpm)" stroke="#0284c7" stroke-opacity="0.7" stroke-width="1.2"/>
      <rect x="14" y="14" width="70" height="20" rx="4" fill="#075985"/>
      <text x="22" y="28" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10" font-weight="700">STAGE 3</text>
      <text x="14" y="58" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Clean Execution</text>
      <text x="14" y="78" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">Antigravity executes rewritten command:</text>

      <rect x="14" y="96" width="202" height="42" rx="6" fill="#031d2e" stroke="#0369a1"/>
      <text x="24" y="116" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">Executed in shell:</text>
      <text x="24" y="130" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">$ pnpm add lodash</text>

      <text x="14" y="165" fill="#67e8f9" font-family="-apple-system, sans-serif" font-size="10.5">✓ Zero agent interruptions</text>
    </g>

    <!-- Connector Arrow 3 -> 4 -->
    <g transform="translate(850, 92)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 2"/>
      <polygon points="45,0 33,-5 33,5" fill="#10b981"/>
    </g>

    <!-- Stage 4: Central Store Result -->
    <g transform="translate(905, 0)">
      <rect width="195" height="185" rx="10" fill="url(#nodeStore)" stroke="#ea580c" stroke-opacity="0.8" stroke-width="1.2"/>
      <rect x="14" y="14" width="75" height="20" rx="4" fill="#7c2d12"/>
      <text x="22" y="28" fill="#fdba74" font-family="ui-monospace, monospace" font-size="10" font-weight="700">OUTCOME</text>
      <text x="14" y="58" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Hard-link Store</text>
      <text x="14" y="78" fill="#fdba74" font-family="-apple-system, sans-serif" font-size="11.5">Packages stored once globally:</text>

      <rect x="14" y="96" width="167" height="42" rx="6" fill="#1f0902" stroke="#9a3412"/>
      <text x="22" y="114" fill="#f97316" font-family="ui-monospace, monospace" font-size="9.5">~/.local/share/pnpm</text>
      <text x="22" y="130" fill="#4ade80" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">90% Disk Saved</text>

      <text x="14" y="165" fill="#86efac" font-family="-apple-system, sans-serif" font-size="10.5">🚀 Lightning fast links</text>
    </g>
  </g>
</svg>
