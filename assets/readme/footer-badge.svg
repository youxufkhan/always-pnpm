  </g>

  <text x="38" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">
    README crafted with <tspan fill="#f8fafc" font-weight="600">beautify-github-readme</tspan>
