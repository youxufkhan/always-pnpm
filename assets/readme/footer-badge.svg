<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 34" width="320" height="34">
  <title>README crafted with beautify-github-readme</title>
  <defs>
    <linearGradient id="badgeSlateBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="320" height="34" rx="6" fill="#0f172a" stroke="url(#badgeSlateBorder)" stroke-width="1"/>
  
