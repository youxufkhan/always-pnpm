<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <title>always-pnpm Package Deduplication Comparison</title>
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Column Gradients -->
    <linearGradient id="npmCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181114"/>
      <stop offset="100%" stop-color="#241417"/>
    </linearGradient>
    <linearGradient id="pnpmCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081a2e"/>
      <stop offset="100%" stop-color="#0f2942"/>
    </linearGradient>

    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="compGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="compGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" rx="14" fill="url(#compBg)"/>
  <rect width="1200" height="440" rx="14" fill="url(#compGrid)"/>
  <rect x="1" y="1" width="1198" height="438" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em">
      Storage Architecture: npm vs. always-pnpm
    </text>
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      Real disk consumption across 5 typical projects (React, TypeScript, Vite, Tailwind, Vitest)
    </text>
  </g>

  <!-- Side-by-Side Columns -->
  <g transform="translate(50, 90)">
    <!-- LEFT: npm Column (The Problem) -->
    <g transform="translate(0, 0)">
      <rect width="530" height="310" rx="12" fill="url(#npmCol)" stroke="#7f1d1d" stroke-width="1.2"/>

      <!-- Column Title -->
      <g transform="translate(24, 20)">
        <rect width="110" height="22" rx="4" fill="#450a0a" stroke="#b91c1c" stroke-width="0.8"/>
        <text x="12" y="15" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11" font-weight="700">STANDARD NPM</text>
        <text x="122" y="16" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Isolated Duplication</text>

        <!-- Storage Bar Gauge -->
        <g transform="translate(0, 36)">
          <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Total Disk Space Occupied:</text>
          <text x="400" y="12" fill="#ef4444" font-family="ui-monospace, monospace" font-size="12" font-weight="800">14.8 GB</text>
          <rect x="0" y="20" width="480" height="12" rx="6" fill="#2d1215"/>
          <rect x="0" y="20" width="440" height="12" rx="6" fill="url(#barRed)"/>
        </g>

        <!-- Project Breakdown Items -->
        <g transform="translate(0, 85)">
          <!-- Item 1 -->
          <g transform="translate(0, 0)">
            <rect width="480" height="28" rx="6" fill="#181113" stroke="#3f171b"/>
            <text x="14" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">📁 apps/web-app</text>
            <text x="320" y="18" fill="#f87171" font-family="ui-monospace, monospace" font-size="10.5">node_modules: ~3.1 GB</text>
            <text x="450" y="18" fill="#ef4444" font-size="11">⚠️</text>
          </g>
          <!-- Item 2 -->
          <g transform="translate(0, 34)">
            <rect width="480" height="28" rx="6" fill="#181113" stroke="#3f171b"/>
            <text x="14" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">📁 apps/admin-portal</text>
            <text x="320" y="18" fill="#f87171" font-family="ui-monospace, monospace" font-size="10.5">node_modules: ~2.9 GB</text>
            <text x="450" y="18" fill="#ef4444" font-size="11">⚠️</text>
          </g>
          <!-- Item 3 -->
          <g transform="translate(0, 68)">
            <rect width="480" height="28" rx="6" fill="#181113" stroke="#3f171b"/>
            <text x="14" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">📁 apps/docs-site</text>
            <text x="320" y="18" fill="#f87171" font-family="ui-monospace, monospace" font-size="10.5">node_modules: ~2.7 GB</text>
            <text x="450" y="18" fill="#ef4444" font-size="11">⚠️</text>
          </g>
          <!-- Item 4 -->
          <g transform="translate(0, 102)">
            <rect width="480" height="28" rx="6" fill="#181113" stroke="#3f171b"/>
            <text x="14" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">📁 apps/customer-dashboard</text>
            <text x="320" y="18" fill="#f87171" font-family="ui-monospace, monospace" font-size="10.5">node_modules: ~3.2 GB</text>
            <text x="450" y="18" fill="#ef4444" font-size="11">⚠️</text>
          </g>
          <!-- Item 5 -->
          <g transform="translate(0, 136)">
            <rect width="480" height="28" rx="6" fill="#181113" stroke="#3f171b"/>
            <text x="14" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11">📁 packages/shared-ui</text>
            <text x="320" y="18" fill="#f87171" font-family="ui-monospace, monospace" font-size="10.5">node_modules: ~2.9 GB</text>
            <text x="450" y="18" fill="#ef4444" font-size="11">⚠️</text>
          </g>
        </g>
      </g>
    </g>

    <!-- RIGHT: always-pnpm Column (The Solution) -->
    <g transform="translate(570, 0)">
      <rect width="530" height="310" rx="12" fill="url(#pnpmCol)" stroke="#0284c7" stroke-width="1.4"/>

      <!-- Column Title -->
      <g transform="translate(24, 20)">
        <rect width="110" height="22" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8"/>
        <text x="12" y="15" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ALWAYS-PNPM</text>
        <text x="124" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Content-Addressable Hard-Links</text>

        <!-- Storage Bar Gauge -->
        <g transform="translate(0, 36)">
          <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Total Disk Space Occupied:</text>
          <text x="400" y="12" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="800">1.35 GB</text>
          <rect x="0" y="20" width="480" height="12" rx="6" fill="#042f2e"/>
          <rect x="0" y="20" width="45" height="12" rx="6" fill="url(#barGreen)"/>
        </g>

        <!-- Central Store Card & Virtual Hardlinks -->
        <g transform="translate(0, 85)">
          <!-- Central Store Box -->
          <rect width="480" height="65" rx="8" fill="#0b1727" stroke="#f97316" stroke-width="1.2"/>
          <circle cx="25" cy="22" r="5" fill="#f97316" filter="url(#compGlow)"/>
          <text x="38" y="26" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Central Global Store: ~/.local/share/pnpm/store</text>
          <text x="38" y="48" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Only 1 copy of react, vite, typescript, etc. saved on disk (1.35 GB)</text>

          <!-- 5 Project Hard-link connections -->
          <g transform="translate(0, 80)">
            <rect width="480" height="75" rx="8" fill="#082032" stroke="#0ea5e9" stroke-opacity="0.4"/>
            <text x="14" y="25" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">5 Projects Connected via OS Hard Links:</text>
            <text x="14" y="46" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">
              web-app  ·  admin-portal  ·  docs-site  ·  dashboard  ·  shared-ui
            </text>
            <text x="14" y="64" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">
              ⚡ Per-project node_modules size: &lt; 2 MB of hard-link pointers
            </text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
