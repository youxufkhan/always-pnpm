<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <title>always-pnpm Package Deduplication Comparison - Midnight Slate</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="compSlateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Column Gradients -->
    <linearGradient id="colNpmSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181115"/>
      <stop offset="100%" stop-color="#140d12"/>
    </linearGradient>
    <linearGradient id="colPnpmSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a1522"/>
    </linearGradient>

    <linearGradient id="barRedSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="barGreenSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <pattern id="compSlateGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="14" fill="url(#compSlateBg)"/>
  <rect width="1200" height="420" rx="14" fill="url(#compSlateGrid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.02em">
      Storage Architecture: npm vs. always-pnpm
    </text>
    <text x="0" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
      Real disk consumption across 5 typical projects (React, TypeScript, Vite, Tailwind, Vitest)
    </text>
  </g>

  <!-- Side-by-Side Columns -->
  <g transform="translate(50, 85)">
    <!-- LEFT: npm Column -->
    <g transform="translate(0, 0)">
      <rect width="530" height="295" rx="10" fill="url(#colNpmSlate)" stroke="#4c1d24" stroke-width="1"/>

      <g transform="translate(24, 20)">
        <rect width="105" height="22" rx="4" fill="#2d1217" stroke="#7f1d1d" stroke-width="0.8"/>
        <text x="12" y="15" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">STANDARD NPM</text>
        <text x="116" y="16" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Isolated Duplication</text>

        <!-- Storage Gauge -->
        <g transform="translate(0, 34)">
          <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Total Disk Space Occupied:</text>
          <text x="410" y="12" fill="#ef4444" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">14.8 GB</text>
          <rect x="0" y="18" width="480" height="8" rx="4" fill="#241417"/>
          <rect x="0" y="18" width="440" height="8" rx="4" fill="url(#barRedSlate)"/>
        </g>

        <!-- Project Rows -->
        <g transform="translate(0, 75)">
          <g transform="translate(0, 0)">
            <rect width="480" height="26" rx="5" fill="#181115" stroke="#2e161c"/>
            <text x="12" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">📁 apps/web-app</text>
            <text x="340" y="17" fill="#f87171" font-family="ui-monospace, monospace" font-size="10">node_modules: ~3.1 GB</text>
          </g>
          <g transform="translate(0, 30)">
            <rect width="480" height="26" rx="5" fill="#181115" stroke="#2e161c"/>
            <text x="12" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">📁 apps/admin-portal</text>
            <text x="340" y="17" fill="#f87171" font-family="ui-monospace, monospace" font-size="10">node_modules: ~2.9 GB</text>
          </g>
          <g transform="translate(0, 60)">
            <rect width="480" height="26" rx="5" fill="#181115" stroke="#2e161c"/>
            <text x="12" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">📁 apps/docs-site</text>
            <text x="340" y="17" fill="#f87171" font-family="ui-monospace, monospace" font-size="10">node_modules: ~2.7 GB</text>
          </g>
          <g transform="translate(0, 90)">
            <rect width="480" height="26" rx="5" fill="#181115" stroke="#2e161c"/>
            <text x="12" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">📁 apps/customer-dashboard</text>
            <text x="340" y="17" fill="#f87171" font-family="ui-monospace, monospace" font-size="10">node_modules: ~3.2 GB</text>
          </g>
          <g transform="translate(0, 120)">
            <rect width="480" height="26" rx="5" fill="#181115" stroke="#2e161c"/>
            <text x="12" y="17" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">📁 packages/shared-ui</text>
            <text x="340" y="17" fill="#f87171" font-family="ui-monospace, monospace" font-size="10">node_modules: ~2.9 GB</text>
          </g>
        </g>
      </g>
    </g>

    <!-- RIGHT: always-pnpm Column -->
    <g transform="translate(570, 0)">
      <rect width="530" height="295" rx="10" fill="url(#colPnpmSlate)" stroke="#0c4a6e" stroke-width="1"/>

      <g transform="translate(24, 20)">
        <rect width="105" height="22" rx="4" fill="#0c2e44" stroke="#0284c7" stroke-width="0.8"/>
        <text x="12" y="15" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">ALWAYS-PNPM</text>
        <text x="118" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Content-Addressable Hard-Links</text>

        <!-- Storage Gauge -->
        <g transform="translate(0, 34)">
          <text x="0" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Total Disk Space Occupied:</text>
          <text x="415" y="12" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">1.35 GB</text>
          <rect x="0" y="18" width="480" height="8" rx="4" fill="#042826"/>
          <rect x="0" y="18" width="45" height="8" rx="4" fill="url(#barGreenSlate)"/>
        </g>

        <!-- Central Store Card & Virtual Hardlinks -->
        <g transform="translate(0, 75)">
          <rect width="480" height="58" rx="6" fill="#0f1f33" stroke="#f97316" stroke-opacity="0.8" stroke-width="1"/>
          <circle cx="20" cy="20" r="4.5" fill="#f97316"/>
          <text x="32" y="24" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">Central Store: ~/.local/share/pnpm/store</text>
          <text x="32" y="44" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10.5">Only 1 copy of react, vite, typescript saved on disk (1.35 GB)</text>

          <g transform="translate(0, 70)">
            <rect width="480" height="68" rx="6" fill="#0a1728" stroke="#0ea5e9" stroke-opacity="0.3"/>
            <text x="14" y="23" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">5 Projects Connected via OS Hard Links:</text>
            <text x="14" y="42" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10">
              web-app  ·  admin-portal  ·  docs-site  ·  dashboard  ·  shared-ui
            </text>
            <text x="14" y="58" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">
              ⚡ Per-project node_modules: &lt; 2 MB of hard-link pointers (91% saved)
            </text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
