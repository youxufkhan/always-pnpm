<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <title>always-pnpm: Stop Letting AI Agents Fill Your SSD With npm</title>
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="60%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <!-- Subtle Slate Grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>

    <!-- Terminal Window Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="barNpm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="barPnpm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1000" height="420" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="420" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="418" rx="11" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Left Side: Copy and Context (x: 48, y: 44) -->
  <g transform="translate(48, 44)">
    <!-- Project Tag -->
    <g transform="translate(0, 0)">
      <rect width="128" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="17" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">ALWAYS-PNPM</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="72" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em">
      Stop Letting AI Agents
    </text>
    <text x="0" y="112" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em">
      Fill Your SSD With npm
    </text>

    <!-- Subtitle -->
    <text x="0" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Rewrites agent tool calls to pnpm before the shell runs.
    </text>
    <text x="0" y="176" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">
      Shared global store. No duplicate packages across projects.
    </text>

    <!-- Agent Compatibility Row -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" fill="#475569" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="0.05em">SUPPORTED AGENT RUNTIMES</text>
      
      <g transform="translate(0, 14)">
        <rect x="0" y="0" width="88" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Claude</text>

        <rect x="96" y="0" width="112" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="108" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Antigravity</text>

        <rect x="216" y="0" width="102" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="228" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">OpenCode</text>

        <rect x="326" y="0" width="82" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="338" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Codex</text>
      </g>
    </g>

    <!-- Repo link tag -->
    <g transform="translate(0, 308)">
      <text x="0" y="12" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12">github.com/youxufkhan/always-pnpm</text>
    </g>
  </g>

  <!-- Right Side: Unified Terminal & Storage Monitor (x: 485, y: 36, w: 468, h: 348) -->
  <g transform="translate(485, 36)">
    <!-- Window Frame -->
    <rect width="468" height="348" rx="10" fill="url(#termBg)" stroke="#334155" stroke-width="1.2"/>

    <!-- Window Title Bar -->
    <rect width="468" height="34" rx="10" fill="#0c1322"/>
    <rect y="24" width="468" height="10" fill="#0c1322"/>
    <circle cx="18" cy="17" r="4" fill="#475569"/>
    <circle cx="32" cy="17" r="4" fill="#475569"/>
    <circle cx="46" cy="17" r="4" fill="#475569"/>
    <text x="64" y="21" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">bash :: tool_call_interception</text>
    <line x1="0" y1="34" x2="468" y2="34" stroke="#1e293b" stroke-width="1"/>

    <!-- Terminal Content Section -->
    <g transform="translate(20, 52)">
      <!-- Line 1: Agent intent -->
      <text x="0" y="16" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">agent proposal:</text>
      <text x="126" y="16" fill="#f87171" font-family="ui-monospace, monospace" font-size="13" text-decoration="line-through">$ npm install express lodash</text>

      <!-- Line 2: Intercepted and rewritten -->
      <g transform="translate(0, 36)">
        <text x="0" y="16" fill="#f97316" font-family="ui-monospace, monospace" font-size="12" font-weight="700">hook rewrite:</text>
        <rect x="122" y="0" width="220" height="24" rx="4" fill="#0c2338" stroke="#0284c7" stroke-width="0.8"/>
        <text x="132" y="16" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="600">$ pnpm add express lodash</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="20" y1="130" x2="448" y2="130" stroke="#1e293b" stroke-width="1"/>

    <!-- Storage Comparison Section -->
    <g transform="translate(20, 146)">
      <text x="0" y="14" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.04em">DISK SPACE ACROSS 5 PROJECTS</text>

      <!-- npm storage row -->
      <g transform="translate(0, 32)">
        <text x="0" y="14" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">npm</text>
        <text x="44" y="14" fill="#f87171" font-family="ui-monospace, monospace" font-size="12" font-weight="700">14.8 GB</text>
        <rect x="110" y="3" width="270" height="14" rx="3" fill="#2d1217"/>
        <rect x="110" y="3" width="270" height="14" rx="3" fill="url(#barNpm)"/>
        <text x="390" y="14" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">5x copies</text>
      </g>

      <!-- pnpm storage row -->
      <g transform="translate(0, 66)">
        <text x="0" y="14" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12">pnpm</text>
        <text x="44" y="14" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">3.2 GB</text>
        <rect x="110" y="3" width="270" height="14" rx="3" fill="#062822"/>
        <rect x="110" y="3" width="58" height="14" rx="3" fill="url(#barPnpm)"/>
        <text x="390" y="14" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">-78%</text>
      </g>
    </g>

    <!-- Bottom Architecture Details -->
    <g transform="translate(20, 266)">
      <rect width="428" height="58" rx="6" fill="#080e18" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#10b981"/>
      <text x="28" y="22" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">
        store: ~/.local/share/pnpm/store
      </text>
      <text x="28" y="42" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
        Packages write once. Projects use filesystem hard links.
      </text>
    </g>
  </g>
</svg>
